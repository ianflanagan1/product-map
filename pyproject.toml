[project]
name = "product-map"
version = "0.1.0"
description = "A product map of an app, for the people who report problems with it: its pages, what's on them, who can use them and the messages they show, read from the code, with a short description of each written once by Claude."
requires-python = ">=3.13"
dependencies = ["cli-kit", "repo-settings"]

[project.scripts]
product-map = "product_map.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", branch = "main" }
repo-settings = { git = "https://github.com/ianflanagan1/repo-settings", branch = "main" }

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "product_map"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
